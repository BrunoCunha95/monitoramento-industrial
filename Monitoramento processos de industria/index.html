
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitoramento Industrial</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="background"></canvas>
  <div class="container">
    <h1>Sistema de Monitoramento Industrial</h1>
    <div class="dashboard">
      <div class="grafico-area">
        <canvas id="grafico"></canvas>
      </div>
      <div class="machine-info" id="machineInfo">
        <!-- Dados da máquina serão preenchidos pelo JS -->
      </div>
    </div>
    <div class="botoes">
      <button onclick="gerarRelatorio()">Gerar Relatório</button>
      <button onclick="iniciarSimulacao()">Iniciar Simulação</button>
      <button onclick="exportarDados()">Exportar Dados</button>
    </div>
  </div>
  <canvas id="particles"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
